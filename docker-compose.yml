version: '3.8'
x-common:
  database:
    &db-environment
    # Database connection settings
    MYSQL_PASSWORD: &db-password "pterodactylPassword"
    MYSQL_ROOT_PASSWORD: "pterodactylRootPassword"
  panel:
    &panel-environment
    APP_URL: "http://localhost"
    # Timezone configuration (http://php.net/manual/en/timezones.php)
    APP_TIMEZONE: "UTC"
    APP_SERVICE_AUTHOR: "noreply@example.com"
    # Uncomment for Let's Encrypt SSL
    # LE_EMAIL: "admin@example.com"
  mail:
    &mail-environment
    MAIL_FROM: "noreply@example.com"
    MAIL_DRIVER: "smtp"
    MAIL_HOST: "mail"
    MAIL_PORT: "1025"
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_ENCRYPTION: "true"

services:
  database:
    image: mariadb:10.5
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "./database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
    ports:
      - "3306:3306"
    networks:
      - pterodactyl_network

  cache:
    image: redis:alpine
    restart: always
    networks:
      - pterodactyl_network

  # Mailhog for local email testing
  mail:
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - "8025:8025"
    networks:
      - pterodactyl_network

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - database
      - cache
      - mail
    volumes:
      - "./var/:/app/var/"
      - "./nginx/:/etc/nginx/http.d/"
      - "./certs/:/etc/letsencrypt/"
      - "./logs/:/app/storage/logs"
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
    networks:
      - pterodactyl_network

networks:
  pterodactyl_network:
    driver: bridge